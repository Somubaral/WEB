<!DOCTYPE html>
<html lang="en">
<head>
    <title>Absolute potitions</title>
    <style>
        .container
        {   
            background-color: aqua;
            border: 2px solid yellowgreen;
            height: 200px;
            width: 300px;
            margin: 100px auto;
            /* position: relative; */
        }
        .items
        {
            height: 200px;
            width: 200px;
            background-color: red;
            border: 2px solid blue;
            position: absolute;
            top: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="items"></div>
        </div>
    </div>
</body>
</html>
