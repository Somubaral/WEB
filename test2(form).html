<!DOCTYPE html>
<html lang="en">
<head>
    <title>form</title>
    <style>
        body
        {
            background-color: black;
        }
        .container
        {
            background-color: yellow;
            width: 300px;
            text-align: center;
            padding: 30px 0px;
            margin: 100px auto;
            border-radius: 30px;

        }
        .item
        {    
            margin-bottom: 20px;            
        }
        input
        {
            border: none;
            background: transparent;
            text-align: center;
            border-bottom: 2px dotted black;
            padding: 10px auto;
            margin: 20px ;
        }
        button
        {
            background-color: black;
            color: white;
            border-radius: 5px;
            padding:10px 20px;
        }
        button:hover
        {
            background-color: red;
        }
    </style>
</head>
<body>
        <form action="">
            <div class="container">
                <div class="item">
                    <input type="text" placeholder="Enter the Name">
                </div>
                <div class="item">
                    <input type="password" placeholder="Enter the Password">
                </div>
                <div class="item">
                    <input type="password" placeholder="Re-enter the Password">
                </div>
                <div class="item">
                    <button>submit</button>
                </div>

            </div>
        </form>
</body>
</html>
