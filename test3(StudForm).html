<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Info</title>
    <link rel="stylesheet" href="test3(StudForm).css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Student Information Form</legend>
            <Table width=100%>
                <tr>
                    <td><label for="">Student Name</label></td>
                    <Td><input type="text" placeholder="Enter Student's Name"></Td>
                    <td><label for="">Father's Name</label></td>
                    <Td><input type="text" placeholder="Enter Father's Name"></Td>
                    <td><label for="">Mother's Name</label></td>
                    <Td><input type="text" placeholder="Enter Mother's Name"></Td>

                </tr>
                <tr>
                    <td><label for="">Date Of Birth</label></td>
                    <td><input type="date"></td>
                    <td><label for="">Age</label></td>
                    <td><input type="number"></td>
                    <td><label for="">Gender</label></td>
                    <td>
                        <input type="radio" name="radio">Male
                        <input type="radio" name="radio">Female
                        <input type="radio" name="radio">Others
                    </td>
                </tr>
                <tr>
                    <td><label for="">Contact No.</label></td>
                    <td><input type="number"></td>
                    <td><label for="">Alternate No.</label></td>
                    <td><input type="number"></td>
                    <td><label for="">Email</label></td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td><label for="">Language</label></td>
                    <td>
                        <input type="checkbox" name="checkbox" id="">English<br>
                        <input type="checkbox" name="checkbox" id="">Hindi<br>
                        <input type="checkbox" name="checkbox" id="">Odia<br>
                        <input type="checkbox" name="checkbox" id="">telegu<br>
                        <input type="checkbox" name="checkbox" id="">Kanada<br>
                        <input type="checkbox" name="checkbox" id="">Others
                    </td>
                    <td><label for="">Address</label></td>
                    <td><textarea name=" " id="" rows="5" cols="20"></textarea></td>
                    <td><label for="">State</label></td>
                    <td><select name="" id="">
                        <option value="">Select</option>
                        <option value="">Karnataka</option>
                        <option value="">Goa</option>
                        <option value="">Odisha</option>
                        <option value="">Andra Pradesh</option>
                        <option value="">Kerla</option>
                        <option value="">others</option>
                        </select></td>
                </tr>
                <tr>
                    <td><label for="">Resume</label></td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td align="center" colspan="6"><button>SUBMIT</button><button>RESET</button></td>
                </tr>
            </Table>
        </fieldset>
    </form>
    
</body>
</html>
