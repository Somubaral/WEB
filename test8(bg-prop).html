<!DOCTYPE html>
<html lang="en">
<head>
    <title>Background Properties Basics</title>
    <style>
        div
        {
            height: 450px;
            /* width: 400px;  if we are giving only height the it will cover the entair webpage*/
            border: 5px solid black; /* creating a box  */
            /* background-color: aqua; single color in background */
            background-image: linear-gradient(45deg/*deg is used inclination*/,red,brown,black,yellow,green);/*multiple colors we can use*/

        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
