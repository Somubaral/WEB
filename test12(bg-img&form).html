<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        body{
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfs_RDSILti8UFcj1duSqtoBkQfDruYm5H8w&s);
            background-size: cover;
            background-position: center;
        }
        .container{
            width: 300px;
            border: 2px solid white;
            text-align: center;
        
            border-radius: 10px;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfs_RDSILti8UFcj1duSqtoBkQfDruYm5H8w&s);
            background-size: cover;
            background-position: center center;
            margin: auto;
            margin-top: 150px;
            padding: 20px;
           
        }
       .container:hover{
        box-shadow: 0px 0px 20px black;

       }
       input{
       /* margin-bottom: 20px auto;*/
        outline: none;
        border: none;
        border-bottom: 2px solid rgb(137, 114, 205);
       /* padding: 10px;*/
       background: transparent;
       color: rgb(83, 198, 239);
       }
       .items{
        padding: 10px;
       }
       button:hover
       {
        background-color: aquamarine;
        box-shadow: 0px 0px 20px rgb(19, 212, 148);
       }
       input:hover
       {
        background-color: rgb(182, 245, 224);
       }
       </style>
</head>
<body>
    <form action=""> 
        <div class="container">
            <input type="text" placeholder="Enter the username">
        
         <div class="items">
            <input type="password" placeholder="Enter the password">
         </div>
         <div class="items">
            <input type="password" placeholder="Re-enter the password">
         </div>
         <div>
            <button>Submit</button>
         </div>
         </div>
</form>
</body>
</html>
