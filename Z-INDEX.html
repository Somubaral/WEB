<!DOCTYPE html>
<html lang="en">
<head>
    <title>Z INDEX</title>
    <style>
        
        .item{
            height: 150px;
            width: 150px;
            border: 5px solid black;
        }
        #d1
        {
            background-color: yellow;
            position: absolute;
            z-index: 1;
        }
        #d2
        {
            background-color: blue;
            position: absolute;
            top: 100px;
            left: 100px;
            z-index: 2;
        }
        #d3
        {
            background-color: green;
            position: absolute;
            top: 200px;
            left: 200px;
            z-index: 3;
        }
        #d4
        {
            background-color: red;
            position: absolute;
            top: 300px;
            left: 300px;
            z-index: 9;
        }
        #d5
        {
            background-color: yellow;
            z-index: 1;
            position: absolute;
            top: 400px;
            left: 400px;
        }
        #d6
        {
            background-color: blue;
            position: absolute;
            top: 500px;
            left: 500px;
            z-index: 2;
        }
        #d7
        {
            background-color: green;
            position: absolute;
            top: 600px;
            left: 600px;
            z-index: 3;
        }
        #d8
        {
            background-color: red;
            position: absolute;
            top: 700px;
            left: 700px;
            z-index: 4;
        }
    </style>
</head>
<body>
    <div class="cointainer"></div>
    <div class="item" id="d1"></div>
    <div class="item" id="d2"></div>
    <div class="item" id="d3"></div>
    <div class="item" id="d4"></div>
    <div class="item" id="d5"></div>
    <div class="item" id="d6"></div>
    <div class="item" id="d7"></div>
    <div class="item" id="d8"></div>
</body>
</html>
